ver = "0.4.1"

[[tests]]
name = "[legacy] Cocotb correctness tests"
paths = [
  "../tests/xilinx/cocotb/dot-product/",
  "../tests/xilinx/cocotb/vectorized-add/",
]
cmd = """
mkdir -p {}/hdl && \
dir_name=$(basename {}) && \
fud e -q --from calyx {}/${dir_name}.futil --to synth-verilog -o {}/hdl/main.sv &&\
  fud e -q --from calyx {}/${dir_name}.futil --to axi-wrapper -o {}/hdl/toplevel.v

cd {}/../ && \
make --silent -B TEST_PATH={} COCOTB_LOG_LEVEL=CRITICAL |\
    grep -E '^Output:' |\
    sed 's/Output://g' &&\
  make clean && \
  rm -f results.xml

"""


# Assumes same basename for .futil and .yxi
# TODO(nnavarro): Change paths to `yxi/tests/axi/*/*-vec-add.futil` when calyx-AXI wrapper is fixed
[[tests]]
name = "cocotb axi: read-compute-write"
paths = ["axi/read-compute-write/*-vec-add.futil"]
cmd = """
 dynamic=$(head -n 2 {} | tail -n 1 | cut -c 4-) && \
 dirname=$(dirname {}) && \
 filename=$(basename {} .futil) && \
 fud2 {} --to calyx --through axi-wrapped --set ${dynamic} -o axi-wrapped.futil 2> /dev/null && \
 fud2 axi-wrapped.futil --from calyx --to verilog-noverify -o axi-wrapped.v 2> /dev/null && \
 fud2 axi-wrapped.v --from verilog-noverify --to cocotb-axi --set sim.data=${dirname}/../vectorized-add.data 2> /dev/null
 """

# TODO: ignore doitgen, its mems are too big
[[tests]]
name="cocotb axi: polybench"
paths = ["../../cider/tests/benchmarks/polybench/*.fuse"]
expect_dir = "axi/polybench"
cmd="""
  filename=$(basename {} .fuse) && \
  fud2 --from dahlia --to calyx {} -o compiled/${filename}.futil &&\
  jq -f ../../tools/mem_flat/data_flat.jq -S {}.data > compiled/${filename}.data &&\
../../target/debug/fud2 compiled/${filename}.futil --to calyx --through axi-wrapped-flat -o compiled/${filename}-axi-wrapped.futil 2> /dev/null && \
./util_scripts/vlog-sim.sh $filename compiled/${filename}.data 2> /dev/null |
  jq -f ../sim_clean.jq -S
  
"""

# doitgen: >256 mem size


# only binheap has actual data
[[tests]]
name="cocotb axi: queues"
paths = [
  "../../frontends/queues/tests/binheap/binheap_test.py",
]
cmd="""
  filename=$(basename {} .py) && \
  dir=$(dirname {}) &&
  python3 {} 20000 --keepgoing > compiled/${filename}.futil &&\
  fud2 compiled/${filename}.futil --to calyx --through axi-wrapped -o compiled/${filename}-axi-wrapped.futil 2> /dev/null && \
./util_scripts/vlog-sim.sh $filename ${dir}/${filename}.data 2> /dev/null | jq -f ../sim_clean.jq -S
"""

# TODO: wants cycle count for some reason
[[tests]]
name = "cocotb axi: exp"
paths = ["../../tests/correctness/exp/*.txt"]
cmd = """
filename=$(basename {} .txt) && \
dir=$(dirname {}) && \
python3 ../../calyx-py/calyx/gen_exp.py {} > compiled/${filename}.futil &&\
../../target/debug/fud2 compiled/${filename}.futil --to calyx --through axi-wrapped -o compiled/${filename}-axi-wrapped.futil 2> /dev/null && \
../../target/debug/cider-data-converter $dir/${filename}.txt.data -x --to json > compiled/${filename}-hex.data &&\
fud2 compiled/${filename}-axi-wrapped.futil --from calyx --to verilog-noverify -o compiled/${filename}-axi-wrapped.v 2> /dev/null && \
../../target/debug/fud2 compiled/${filename}-axi-wrapped.v --from verilog-noverify --to cocotb-axi --set sim.data=compiled/${filename}-hex.data -s hex=true > compiled/${filename}-out.data &&\
../../target/debug/cider-data-converter compiled/${filename}-out.data --to json 
"""

[[tests]]
name = "cocotb axi: ntt"
paths = ["../../tests/correctness/ntt-pipeline/*.txt"]
cmd = """
filename=$(basename {} .txt) &&\
fud2 --from ntt {} --to calyx -q -o compiled/${filename}.futil &&\
