fud2 compiled/${filename}-axi-wrapped.futil --from calyx --to verilog-noverify -o compiled/${filename}-axi-wrapped.v 2> /dev/null && \
fud2 compiled/${filename}-axi-wrapped.v --from verilog-noverify --to cocotb-axi --set sim.data=../../../tests/correctness/ntt-pipeline/${filename}.data
"""

